# Auto-generated by Cimas: Do not edit it manually!
# See https://github.com/metanorma/cimas
inherit_from:
  - https://raw.githubusercontent.com/riboseinc/oss-guides/main/ci/rubocop.yml
  - .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

# local repo-specific modifications
# ...
plugins:
  - rubocop-rspec
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  Exclude:
    - 'lib/lutaml/lml/grammar/lml.artifact.json'

# VerifiedDoubles is disabled because many spec files use double() to mock
# UML model classes (Lutaml::Uml::Class, Package, etc.) that don't implement
# all stubbed methods as real Ruby methods (they use Lutaml::Model::Serializable
# attribute declarations). Converting to instance_double would cause test failures
# due to method verification.
RSpec/VerifiedDoubles:
  Enabled: false
  Exclude:
    - 'spec/**/*'

# LML front (absorbed from lutaml-lml): its corpus predates gating, so
# metrics are off and the Rakefile's rubocop_ratchet task gates NEW
# offenses on changed files.
Metrics:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/StringLiteralsInInterpolation:
  Enabled: false
Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
Layout/LineLength:
  Enabled: false
