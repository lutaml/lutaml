# Auto-generated by Cimas: Do not edit it manually!
# See https://github.com/metanorma/cimas
name: release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

# One release at a time: concurrent bumps race the version commit
# and half-published gems are worse than a queued release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
    secrets:
      # OMIT rubygems-api-key: metanorma/ci switches to OIDC Trusted Publishing
      # when the secret is empty (USE_OIDC = rubygems-api-key == ''). Trusted
      # Publishing is already configured for the lutaml gems on rubygems.org.
      # The removed `gated` input no longer exists in the reusable workflow
      # and made every dispatch fail at startup.
      pat_token: ${{ secrets.LUTAML_CI_PAT_TOKEN }}
