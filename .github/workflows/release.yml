# Per-package releases. Tags are "<package>-v<version>" (for example
# lutaml-v0.12.0 or lutaml-model-v0.8.163); each tag publishes exactly one gem
# from packages/<package>. metanorma/ci's rubygems-release.yml has no
# package/working-directory input, so this workflow is self-contained.
#
#   1. Dispatch "prepare" with a package and next version (x.y.z | major |
#      minor | patch | skip): it bumps that package's version file, commits to
#      main and pushes the tag.
#   2. The tag push runs "publish": it verifies the tag against the gemspec,
#      builds the gem and pushes it to RubyGems with Trusted Publishing (OIDC).
#
# A tag pushed with GITHUB_TOKEN would not start step 2, so step 1 pushes with
# LUTAML_CI_PAT_TOKEN. The package/version choice stays a human decision.
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - lutaml
          - lutaml-model
          - lutaml-xsd
          - lutaml-jsonschema
          - lutaml-graphviz
          - expressir
      next_version:
        description: 'x.y.z, major, minor, patch, or skip (release the version already in the gemspec)'
        required: true
        default: skip
  push:
    tags:
      - 'lutaml-v*'
      - 'lutaml-model-v*'
      - 'lutaml-xsd-v*'
      - 'lutaml-jsonschema-v*'
      - 'lutaml-graphviz-v*'
      - 'expressir-v*'

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time per package: concurrent bumps race the version commit.
    concurrency:
      group: release-${{ inputs.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.LUTAML_CI_PAT_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Bump the version and tag
        env:
          PACKAGE: ${{ inputs.package }}
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          git config user.name "lutaml-ci"
          git config user.email "open.source@ribose.com"
          if [ "$NEXT_VERSION" != "skip" ]; then
            scripts/monorepo.rb bump "$PACKAGE" "$NEXT_VERSION"
            git commit -a -m "release $PACKAGE $(scripts/monorepo.rb version "$PACKAGE")"
          fi
          tag="$(scripts/monorepo.rb tag "$PACKAGE")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          git tag "$tag"
          git push origin HEAD "refs/tags/$tag"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release for the tag
      id-token: write   # RubyGems Trusted Publishing
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve the package from the tag
        id: pkg
        run: |
          set -euo pipefail
          # check-tag fails unless <package>-v<version> equals the gemspec version
          echo "name=$(scripts/monorepo.rb check-tag "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: rubygems/configure-rubygems-credentials@main
      - name: Build and push the gem
        working-directory: packages/${{ steps.pkg.outputs.name }}
        env:
          PACKAGE: ${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          gem build "$PACKAGE.gemspec"
          gem push ./"$PACKAGE"-*.gem
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
